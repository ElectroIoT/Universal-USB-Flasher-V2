<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img">
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
.t{fill:#e6eef8;font-weight:700;font-size:15px}
.s{fill:#9cb0c6;font-size:12.5px}
.h{fill:#e6eef8;font-weight:800;font-size:22px}
.box{fill:#122235;stroke:#25405c;stroke-width:2}
.flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 12;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-44}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1000" height="410" rx="22" fill="#0b1622"/>
<defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f7a4f"/><stop offset="1" stop-color="#07432b"/></linearGradient>
<linearGradient id="chipg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#121418"/></linearGradient>
<radialGradient id="glow" cx="80%" cy="0%" r="70%"><stop offset="0" stop-color="#14b8a6" stop-opacity=".35"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient></defs><text x="40" y="52" class="h">Power path</text><text x="40" y="78" class="s">USB 5 V → polyfuse → Schottky → LDO → current-limited target switches. The IO switch picks the CH342F logic level.</text><rect class="box" x="30" y="120" width="130" height="76" rx="14"/><text class="t" x="95" y="152" text-anchor="middle">USB-C</text><text class="s" x="95" y="174" text-anchor="middle">VBUS</text><rect x="63" y="96" width="64" height="22" rx="11" fill="#c084fc22" stroke="#c084fc"/><text x="95" y="112" text-anchor="middle" style="fill:#c084fc;font-weight:800;font-size:12.5px">5.0 V</text><path class="flow" d="M162 158H188" stroke="#c084fc"/><rect class="box" x="190" y="120" width="130" height="76" rx="14"/><text class="t" x="255" y="152" text-anchor="middle">F1 PTC</text><text class="s" x="255" y="174" text-anchor="middle">500 mA hold</text><rect x="223" y="96" width="64" height="22" rx="11" fill="#c084fc22" stroke="#c084fc"/><text x="255" y="112" text-anchor="middle" style="fill:#c084fc;font-weight:800;font-size:12.5px">5.0 V</text><path class="flow" d="M322 158H348" stroke="#c084fc"/><rect class="box" x="350" y="120" width="130" height="76" rx="14"/><text class="t" x="415" y="152" text-anchor="middle">D1 Schottky</text><text class="s" x="415" y="174" text-anchor="middle">back-feed block</text><rect x="383" y="96" width="64" height="22" rx="11" fill="#c084fc22" stroke="#c084fc"/><text x="415" y="112" text-anchor="middle" style="fill:#c084fc;font-weight:800;font-size:12.5px">≈4.65 V</text><path class="flow" d="M482 158H508" stroke="#c084fc"/><rect class="box" x="510" y="120" width="130" height="76" rx="14"/><text class="t" x="575" y="152" text-anchor="middle">U1 LDO</text><text class="s" x="575" y="174" text-anchor="middle">SGM2212 800 mA</text><rect x="543" y="96" width="64" height="22" rx="11" fill="#f8717122" stroke="#f87171"/><text x="575" y="112" text-anchor="middle" style="fill:#f87171;font-weight:800;font-size:12.5px">3.30 V</text><path class="flow" d="M642 158H700" stroke="#f87171"/><rect class="box" x="700" y="110" width="160" height="96" rx="14" style="stroke:#fb923c"/><text class="t" x="780" y="140" text-anchor="middle">U4 / U5</text><text class="s" x="780" y="160" text-anchor="middle">TPS2553 switches</text><text class="s" x="780" y="178" text-anchor="middle">0.61 A · 0.51 A limit</text><text class="s" x="780" y="196" text-anchor="middle">SW5 = power-cycle</text><path class="flow" d="M862 158H900" stroke="#fb923c"/><rect class="box" x="900" y="120" width="80" height="76" rx="14"/><text class="t" x="940" y="152" text-anchor="middle">Target</text><text class="s" x="940" y="174" text-anchor="middle">+3V3_T</text><text class="s" x="940" y="190" text-anchor="middle">+5V_T</text><path class="flow" d="M415 198V226H780V208" stroke="#c084fc" style="animation-duration:1.6s"/><text x="600" y="220" text-anchor="middle" style="fill:#c084fc;font-weight:700;font-size:12px">+5V → U5</text><path class="flow" d="M255 198V272H330" stroke="#c084fc"/><rect class="box" x="330" y="244" width="180" height="56" rx="14"/><text class="t" x="420" y="268" text-anchor="middle">CH342F core</text><text class="s" x="420" y="288" text-anchor="middle">VDD5 + VBUS sense</text><path class="flow" d="M575 198V272H620" stroke="#f87171" style="animation-duration:1.6s"/><rect class="box" x="620" y="244" width="170" height="56" rx="14" style="stroke:#f472b6"/><text class="t" x="705" y="268" text-anchor="middle">SW3 → VIO</text><text class="s" x="705" y="288" text-anchor="middle">3V3 or 5V logic · LED5</text><path class="flow" d="M705 302V330H420V302" stroke="#f472b6" style="animation-duration:1.4s"/><text x="562" y="346" text-anchor="middle" style="fill:#f472b6;font-weight:700;font-size:12.5px">VIO → both UARTs</text><text x="30" y="384" class="s">A short on 3V3 or 5V: the TPS2553 limits current within microseconds and lights OVERLOAD. The PTC is the backup that protects the PC.</text>
</svg>