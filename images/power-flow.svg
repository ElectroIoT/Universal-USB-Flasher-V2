<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img">
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
.t{fill:#e6eef8;font-weight:700;font-size:15px}
.s{fill:#9cb0c6;font-size:12.5px}
.h{fill:#e6eef8;font-weight:800;font-size:22px}
.box{fill:#122235;stroke:#25405c;stroke-width:2}
.flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 12;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-44}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1000" height="400" rx="22" fill="#0b1622"/>
<defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f7a4f"/><stop offset="1" stop-color="#07432b"/></linearGradient>
<linearGradient id="chipg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#121418"/></linearGradient>
<radialGradient id="glow" cx="80%" cy="0%" r="70%"><stop offset="0" stop-color="#14b8a6" stop-opacity=".35"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient></defs><text x="40" y="52" class="h">Power path</text><text x="40" y="78" class="s">USB 5 V → polyfuse → Schottky → 3.3 V LDO. The IO switch picks the logic level for the CH343G.</text><rect class="box" x="40" y="120" width="140" height="76" rx="14"/><text class="t" x="110" y="152" text-anchor="middle">USB-C</text><text class="s" x="110" y="174" text-anchor="middle">VBUS</text><rect x="78" y="96" width="64" height="22" rx="11" fill="#c084fc22" stroke="#c084fc"/><text x="110" y="112" text-anchor="middle" style="fill:#c084fc;font-weight:800;font-size:12.5px">5.0 V</text><path class="flow" d="M182 158H218" stroke="#c084fc"/><rect class="box" x="220" y="120" width="140" height="76" rx="14"/><text class="t" x="290" y="152" text-anchor="middle">F1 PTC</text><text class="s" x="290" y="174" text-anchor="middle">500 mA hold</text><rect x="258" y="96" width="64" height="22" rx="11" fill="#c084fc22" stroke="#c084fc"/><text x="290" y="112" text-anchor="middle" style="fill:#c084fc;font-weight:800;font-size:12.5px">5.0 V</text><path class="flow" d="M362 158H398" stroke="#c084fc"/><rect class="box" x="400" y="120" width="140" height="76" rx="14"/><text class="t" x="470" y="152" text-anchor="middle">D1 Schottky</text><text class="s" x="470" y="174" text-anchor="middle">back-feed block</text><rect x="438" y="96" width="64" height="22" rx="11" fill="#c084fc22" stroke="#c084fc"/><text x="470" y="112" text-anchor="middle" style="fill:#c084fc;font-weight:800;font-size:12.5px">≈4.65 V</text><path class="flow" d="M542 158H578" stroke="#c084fc"/><rect class="box" x="580" y="120" width="140" height="76" rx="14"/><text class="t" x="650" y="152" text-anchor="middle">U1 LDO</text><text class="s" x="650" y="174" text-anchor="middle">SGM2212 800 mA</text><rect x="618" y="96" width="64" height="22" rx="11" fill="#f8717122" stroke="#f87171"/><text x="650" y="112" text-anchor="middle" style="fill:#f87171;font-weight:800;font-size:12.5px">3.30 V</text><path class="flow" d="M722 158H800" stroke="#f87171"/><rect class="box" x="800" y="120" width="150" height="76" rx="14"/><text class="t" x="875" y="152" text-anchor="middle">+3V3 rail</text><text class="s" x="875" y="174" text-anchor="middle">H1 · ESP-01 · pull-ups</text><path class="flow" d="M290 198V262H360" stroke="#c084fc"/><rect class="box" x="360" y="232" width="180" height="60" rx="14"/><text class="t" x="450" y="258" text-anchor="middle">CH343G core</text><text class="s" x="450" y="278" text-anchor="middle">VDD5 + VBUS sense</text><path class="flow" d="M470 198V214H640V262H690" stroke="#c084fc" style="animation-duration:1.6s"/><path class="flow" d="M875 198V262H840" stroke="#f87171" style="animation-duration:1.6s"/><rect class="box" x="690" y="232" width="150" height="60" rx="14" style="stroke:#f472b6"/><text class="t" x="765" y="258" text-anchor="middle">SW3 → VIO</text><text class="s" x="765" y="278" text-anchor="middle">3V3 or 5V logic</text><path class="flow" d="M765 294V330H450V294" stroke="#f472b6" style="animation-duration:1.4s"/><text x="610" y="324" text-anchor="middle" style="fill:#f472b6;font-weight:700;font-size:12.5px">VIO → CH343G I/O pins</text><text x="40" y="372" class="s">Short on the 5V pin? The PTC heats up and limits current, so the PC port stays safe. It resets on its own once the short is removed.</text>
</svg>