<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img">
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
.t{fill:#e6eef8;font-weight:700;font-size:15px}
.s{fill:#9cb0c6;font-size:12.5px}
.h{fill:#e6eef8;font-weight:800;font-size:22px}
.box{fill:#122235;stroke:#25405c;stroke-width:2}
.flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 12;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-44}}

.lever{transform-origin:150px 190px;animation:lever 6s ease-in-out infinite}
@keyframes lever{0%,40%{transform:rotate(-28deg)}50%,90%{transform:rotate(28deg)}100%{transform:rotate(-28deg)}}
.w33{animation:w33 6s step-end infinite}.w5{animation:w5 6s step-end infinite}
@keyframes w33{0%{opacity:1}45%{opacity:0}95%{opacity:1}}
@keyframes w5{0%{opacity:0}45%{opacity:1}95%{opacity:0}}
.scroll{animation:scroll 1.5s linear infinite}
@keyframes scroll{to{transform:translateX(-80px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="960" height="340" rx="22" fill="#0b1622"/>
<defs><clipPath id="cv"><rect x="330" y="110" width="600" height="170"/></clipPath></defs><text x="40" y="52" class="h">3.3 V / 5 V logic switch (SW3) + 5V-IO LED</text><text x="40" y="78" class="s">SW3 feeds the CH342F VIO pin, so both UARTs swing to the target's voltage. In 5 V mode Q3 lights the red 5V IO LED as a warning.</text><circle cx="150" cy="190" r="12" fill="#f472b6"/><path d="M150 190V290" stroke="#f472b6" stroke-width="4"/><text x="150" y="312" text-anchor="middle" style="fill:#f472b6;font-weight:800">VIO</text><circle cx="95" cy="125" r="9" fill="none" stroke="#f87171" stroke-width="3"/><text x="95" y="108" text-anchor="middle" style="fill:#f87171;font-weight:800">3V3</text><circle cx="205" cy="125" r="9" fill="none" stroke="#c084fc" stroke-width="3"/><text x="205" y="108" text-anchor="middle" style="fill:#c084fc;font-weight:800">5V</text><g class="lever"><path d="M150 190V122" stroke="#e6eef8" stroke-width="6" stroke-linecap="round"/></g><g class="w5"><circle cx="250" cy="220" r="22" fill="#ef4444" opacity=".35"/><circle cx="250" cy="220" r="9" fill="#ef4444"/><text x="250" y="262" text-anchor="middle" style="fill:#ef4444;font-weight:800;font-size:12px">5V IO!</text></g><g class="w33"><circle cx="250" cy="220" r="9" fill="#3f1d1d"/><text x="250" y="262" text-anchor="middle" class="s" style="font-size:12px">LED5 off</text></g><path d="M330 260H930" stroke="#25405c"/><text x="320" y="264" text-anchor="end" class="s">0 V</text><g clip-path="url(#cv)"><g class="w33"><path class="scroll" d="M330 260H370V194H410V260H450V194H490V260H530V194H570V260H610V194H650V260H690V194H730V260H770V194H810V260H850V194H890V260H930V194H970V260H1010V194H1050V260H1090V194H1130V260" fill="none" stroke="#f87171" stroke-width="3.5"/></g><g class="w5"><path class="scroll" d="M330 260H370V136H410V260H450V136H490V260H530V136H570V260H610V136H650V260H690V136H730V260H770V136H810V260H850V136H890V260H930V136H970V260H1010V136H1050V260H1090V136H1130V260" fill="none" stroke="#c084fc" stroke-width="3.5"/></g></g><g class="w33"><path d="M330 194H930" stroke="#f87171" stroke-dasharray="4 6" opacity=".6"/><text x="320" y="198" text-anchor="end" style="fill:#f87171;font-weight:800">3.3 V</text><text x="630" y="304" text-anchor="middle" class="t">ESP32 · ESP8266 · ESP-01 · 3.3 V Pro Mini</text></g><g class="w5"><path d="M330 136H930" stroke="#c084fc" stroke-dasharray="4 6" opacity=".6"/><text x="320" y="140" text-anchor="end" style="fill:#c084fc;font-weight:800">≈4.6 V</text><text x="630" y="304" text-anchor="middle" class="t">5 V Arduino · 5 V Pro Mini · 5 V ATtiny</text></g>
</svg>