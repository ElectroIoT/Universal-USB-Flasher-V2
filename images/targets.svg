<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img">
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
.t{fill:#e6eef8;font-weight:700;font-size:15px}
.s{fill:#9cb0c6;font-size:12.5px}
.h{fill:#e6eef8;font-weight:800;font-size:22px}
.box{fill:#122235;stroke:#25405c;stroke-width:2}
.flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 12;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-44}}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="960" height="460" rx="22" fill="#0b1622"/>
<text x="40" y="52" class="h">One board, every common target</text><text x="40" y="78" class="s">PC software sees two COM ports. UART1 flashes the module you plug in or wire up; UART2 watches a second device.</text><rect x="50" y="140" width="150" height="96" rx="8" fill="#122235" stroke="#25405c" stroke-width="2"/><rect x="62" y="152" width="126" height="72" rx="4" fill="#0f2a3d"/><path d="M30 244H220L208 258H42Z" fill="#25405c"/><text x="125" y="186" text-anchor="middle" style="fill:#2dd4bf;font-weight:800;font-size:13px">esptool</text><text x="125" y="204" text-anchor="middle" class="s">Arduino IDE · PIO</text><path class="flow" d="M222 200H330" stroke="#22d3ee"/><text x="276" y="190" text-anchor="middle" class="s">USB-C</text><rect class="box" x="330" y="146" width="170" height="108" rx="16" style="stroke:#2dd4bf"/><text class="t" x="415" y="190" text-anchor="middle">Flasher V2</text><text class="s" x="415" y="212" text-anchor="middle">CH342F · auto-program</text><path class="flow" d="M502 200C560 200 560 116 620 116" stroke="#facc15" style="animation-duration:1.10s"/><rect class="box" x="620" y="96" width="300" height="40" rx="12"/><circle class="pulse" cx="642" cy="116" r="7" fill="#facc15" style="animation-delay:0.0s"/><text class="t" x="660" y="114" style="font-size:14px">ESP32 / S3 / C3</text><text class="s" x="660" y="130" style="font-size:11.5px">auto-program · H1 or J3</text><path class="flow" d="M502 200C560 200 560 166 620 166" stroke="#60a5fa" style="animation-duration:1.22s"/><rect class="box" x="620" y="146" width="300" height="40" rx="12"/><circle class="pulse" cx="642" cy="166" r="7" fill="#60a5fa" style="animation-delay:0.3s"/><text class="t" x="660" y="164" style="font-size:14px">ESP-Prog boards</text><text class="s" x="660" y="180" style="font-size:11.5px">J3 1.27 mm cable</text><path class="flow" d="M502 200C560 200 560 216 620 216" stroke="#facc15" style="animation-duration:1.34s"/><rect class="box" x="620" y="196" width="300" height="40" rx="12"/><circle class="pulse" cx="642" cy="216" r="7" fill="#facc15" style="animation-delay:0.6s"/><text class="t" x="660" y="214" style="font-size:14px">ESP8266 / ESP-12F</text><text class="s" x="660" y="230" style="font-size:11.5px">IO15 pull-down</text><path class="flow" d="M502 200C560 200 560 266 620 266" stroke="#facc15" style="animation-duration:1.46s"/><rect class="box" x="620" y="246" width="300" height="40" rx="12"/><circle class="pulse" cx="642" cy="266" r="7" fill="#facc15" style="animation-delay:0.9s"/><text class="t" x="660" y="264" style="font-size:14px">ESP-01 / 01S</text><text class="s" x="660" y="280" style="font-size:11.5px">plug into J2</text><path class="flow" d="M502 200C560 200 560 316 620 316" stroke="#fb923c" style="animation-duration:1.58s"/><rect class="box" x="620" y="296" width="300" height="40" rx="12"/><circle class="pulse" cx="642" cy="316" r="7" fill="#fb923c" style="animation-delay:1.2s"/><text class="t" x="660" y="314" style="font-size:14px">Arduino / ATmega</text><text class="s" x="660" y="330" style="font-size:11.5px">RST pin (DTR+cap)</text><path class="flow" d="M502 200C560 200 560 366 620 366" stroke="#4ade80" style="animation-duration:1.70s"/><rect class="box" x="620" y="346" width="300" height="40" rx="12"/><circle class="pulse" cx="642" cy="366" r="7" fill="#4ade80" style="animation-delay:1.5s"/><text class="t" x="660" y="364" style="font-size:14px">ATtiny / AVR-Dx</text><text class="s" x="660" y="380" style="font-size:11.5px">UPDI mode</text><path class="flow" d="M502 200C560 200 560 416 620 416" stroke="#3b82f6" style="animation-duration:1.82s"/><rect class="box" x="620" y="396" width="300" height="40" rx="12"/><circle class="pulse" cx="642" cy="416" r="7" fill="#3b82f6" style="animation-delay:1.8s"/><text class="t" x="660" y="414" style="font-size:14px">2nd device log</text><text class="s" x="660" y="430" style="font-size:11.5px">UART2 on J5</text>
</svg>