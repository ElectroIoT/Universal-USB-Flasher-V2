<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" width="980" height="350" role="img">
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
.t{fill:#e6eef8;font-weight:700;font-size:15px}
.s{fill:#9cb0c6;font-size:12.5px}
.h{fill:#e6eef8;font-weight:800;font-size:22px}
.box{fill:#122235;stroke:#25405c;stroke-width:2}
.flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 12;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-44}}

.btn{animation:press 8s step-end infinite}
@keyframes press{0%{transform:translateY(0)}25%{transform:translateY(5px)}40%{transform:translateY(0)}}
.rail{animation:rail 8s step-end infinite}
@keyframes rail{0%{opacity:1}25%{opacity:.12}40%{opacity:1}}
.ovl{animation:ovl 8s step-end infinite;opacity:.15}
@keyframes ovl{0%{opacity:.15}60%{opacity:1}85%{opacity:.15}}
.short{animation:short 8s step-end infinite;opacity:0}
@keyframes short{0%{opacity:0}60%{opacity:1}85%{opacity:0}}
.cur{animation:cur 8s linear infinite;transform-origin:0 0}
.lab{animation:lab 8s step-end infinite}
.lab2{animation:lab2 8s step-end infinite;opacity:0}
.lab3{animation:lab3 8s step-end infinite;opacity:0}
@keyframes lab{0%{opacity:1}25%{opacity:0}40%{opacity:1}60%{opacity:0}85%{opacity:1}}
@keyframes lab2{0%{opacity:0}25%{opacity:1}40%{opacity:0}}
@keyframes lab3{0%{opacity:0}60%{opacity:1}85%{opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="980" height="350" rx="22" fill="#0b1622"/>
<text x="40" y="52" class="h">Current-limited target power (U4/U5 + SW5)</text><text x="40" y="78" class="s">Hold POWER-CYCLE to switch the target off. On a short, the TPS2553 clamps the current and the OVERLOAD LED lights; the PC never sees it.</text><rect class="box" x="40" y="130" width="140" height="80" rx="14"/><text class="t" x="110" y="166" text-anchor="middle">+3V3 / +5V</text><text class="s" x="110" y="188" text-anchor="middle">from LDO / USB</text><path class="flow" d="M182 170H300" stroke="#f87171"/><rect class="box" x="300" y="120" width="190" height="100" rx="16" style="stroke:#fb923c"/><text class="t" x="395" y="160" text-anchor="middle">TPS2553</text><text class="s" x="395" y="182" text-anchor="middle">U4 ≈0.61 A · U5 ≈0.51 A</text><text class="s" x="395" y="200" text-anchor="middle">EN · FAULT# · ILIM</text><g class="rail"><path class="flow" d="M492 170H640" stroke="#fb923c"/></g><rect class="box" x="640" y="120" width="160" height="100" rx="16"/><text class="t" x="720" y="160" text-anchor="middle">Target</text><text class="s" x="720" y="182" text-anchor="middle">+3V3_T · +5V_T</text><g class="short"><path d="M700 196l12-10l6 8l12-10" stroke="#ef4444" stroke-width="4" fill="none"/><text x="720" y="214" text-anchor="middle" style="fill:#ef4444;font-weight:800;font-size:12px">SHORT</text></g><rect x="355" y="262" width="80" height="38" rx="8" fill="#e5e7eb"/><g class="btn"><circle cx="395" cy="281" r="12" fill="#1f2937"/></g><text x="395" y="322" text-anchor="middle" class="t" style="font-size:13px">SW5 POWER</text><path d="M395 262V222" stroke="#60a5fa" stroke-width="3"/><text x="402" y="246" class="s">EN</text><circle class="ovl" cx="560" cy="282" r="22" fill="#ef4444"/><circle cx="560" cy="282" r="9" fill="#ef4444"/><text x="560" y="322" text-anchor="middle" class="t" style="font-size:13px">OVERLOAD</text><path d="M490 200C530 200 560 230 560 260" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-dasharray="4 4"/><text x="540" y="226" class="s">FAULT#</text><rect class="box" x="820" y="120" width="120" height="200" rx="16"/><text class="s" x="880" y="146" text-anchor="middle">state</text><g class="lab"><text class="t" x="880" y="216" text-anchor="middle" style="fill:#4ade80">ON</text><text class="s" x="880" y="238" text-anchor="middle">normal</text></g><g class="lab2"><text class="t" x="880" y="216" text-anchor="middle" style="fill:#9cb0c6">OFF</text><text class="s" x="880" y="238" text-anchor="middle">SW5 held</text></g><g class="lab3"><text class="t" x="880" y="216" text-anchor="middle" style="fill:#ef4444">LIMIT</text><text class="s" x="880" y="238" text-anchor="middle">≈0.6 A clamp</text></g>
</svg>