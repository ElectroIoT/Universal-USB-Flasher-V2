<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img">
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
.t{fill:#e6eef8;font-weight:700;font-size:15px}
.s{fill:#9cb0c6;font-size:12.5px}
.h{fill:#e6eef8;font-weight:800;font-size:22px}
.box{fill:#122235;stroke:#25405c;stroke-width:2}
.flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 12;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-44}}

.jig{animation:jig 5s ease-in-out infinite}
@keyframes jig{0%,15%{transform:translateY(-40px)}35%,75%{transform:translateY(0)}95%,100%{transform:translateY(-40px)}}
.ok{animation:ok 5s step-end infinite;opacity:0}
@keyframes ok{0%{opacity:0}38%{opacity:1}75%{opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="980" height="360" rx="22" fill="#0b1622"/>
<defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f7a4f"/><stop offset="1" stop-color="#07432b"/></linearGradient>
<linearGradient id="chipg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#121418"/></linearGradient>
<radialGradient id="glow" cx="80%" cy="0%" r="70%"><stop offset="0" stop-color="#14b8a6" stop-opacity=".35"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient></defs><text x="40" y="52" class="h">ElectroIoT PROG pad standard (pogo)</text><text x="40" y="78" class="s">6 bare pads in ESP-Prog order at 2.54 mm on every new board. A pogo jig on J4 presses on, and EN/IO0 auto-program does the rest.</text><rect x="80" y="230" width="360" height="110" rx="10" fill="url(#pg)"/><text x="100" y="330" style="fill:#e5e7eb;font-weight:700;font-size:12px">target board (no header)</text><circle cx="200" cy="258" r="14" fill="#d4a34a"/><text x="200" y="262" text-anchor="middle" style="fill:#1f2937;font-weight:800;font-size:12px">1</text><text x="220" y="262" style="fill:#e5e7eb;font-weight:700;font-size:11px">EN</text><circle cx="200" cy="298" r="14" fill="#d4a34a"/><text x="200" y="302" text-anchor="middle" style="fill:#1f2937;font-weight:800;font-size:12px">2</text><text x="220" y="302" style="fill:#e5e7eb;font-weight:700;font-size:11px">VDD</text><circle cx="250" cy="258" r="14" fill="#d4a34a"/><text x="250" y="262" text-anchor="middle" style="fill:#1f2937;font-weight:800;font-size:12px">3</text><text x="270" y="262" style="fill:#e5e7eb;font-weight:700;font-size:11px">TXD</text><circle cx="250" cy="298" r="14" fill="#d4a34a"/><text x="250" y="302" text-anchor="middle" style="fill:#1f2937;font-weight:800;font-size:12px">4</text><text x="270" y="302" style="fill:#e5e7eb;font-weight:700;font-size:11px">GND</text><circle cx="300" cy="258" r="14" fill="#d4a34a"/><text x="300" y="262" text-anchor="middle" style="fill:#1f2937;font-weight:800;font-size:12px">5</text><text x="320" y="262" style="fill:#e5e7eb;font-weight:700;font-size:11px">RXD</text><circle cx="300" cy="298" r="14" fill="#d4a34a"/><text x="300" y="302" text-anchor="middle" style="fill:#1f2937;font-weight:800;font-size:12px">6</text><text x="320" y="302" style="fill:#e5e7eb;font-weight:700;font-size:11px">IO0</text><g class="jig"><rect x="170" y="110" width="180" height="60" rx="10" fill="#122235" stroke="#25405c" stroke-width="2"/><text x="260" y="146" text-anchor="middle" class="t" style="font-size:14px">pogo jig → J4</text><path d="M200 170V222" stroke="#cbd5e1" stroke-width="4"/><path d="M200 170V262" stroke="#cbd5e1" stroke-width="4"/><path d="M250 170V222" stroke="#cbd5e1" stroke-width="4"/><path d="M250 170V262" stroke="#cbd5e1" stroke-width="4"/><path d="M300 170V222" stroke="#cbd5e1" stroke-width="4"/><path d="M300 170V262" stroke="#cbd5e1" stroke-width="4"/></g><g class="ok"><text x="260" y="220" text-anchor="middle" style="fill:#4ade80;font-weight:800;font-size:13px">contact ✓</text></g><text x="500" y="130" class="t" style="fill:#2dd4bf;font-size:13px">Pitch</text><text x="600" y="130" class="s" style="font-size:13px">2.54 mm, 2 × 3</text><text x="500" y="164" class="t" style="fill:#2dd4bf;font-size:13px">Pad</text><text x="600" y="164" class="s" style="font-size:13px">Ø 1.5–1.8 mm, no paste</text><text x="500" y="198" class="t" style="fill:#2dd4bf;font-size:13px">Order</text><text x="600" y="198" class="s" style="font-size:13px">ESP-Prog: 1 EN · 2 VDD · 3 TXD · 4 GND · 5 RXD · 6 IO0</text><text x="500" y="232" class="t" style="fill:#2dd4bf;font-size:13px">Keep-out</text><text x="600" y="232" class="s" style="font-size:13px">1 mm around pads, no parts</text><text x="500" y="266" class="t" style="fill:#2dd4bf;font-size:13px">Optional</text><text x="600" y="266" class="s" style="font-size:13px">2 × Ø 1.0 mm NPTH locating holes</text><text x="500" y="300" class="t" style="fill:#2dd4bf;font-size:13px">Silk</text><text x="600" y="300" class="s" style="font-size:13px">"PROG" + pin 1 dot</text>
</svg>