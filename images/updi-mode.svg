<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img">
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
.t{fill:#e6eef8;font-weight:700;font-size:15px}
.s{fill:#9cb0c6;font-size:12.5px}
.h{fill:#e6eef8;font-weight:800;font-size:22px}
.box{fill:#122235;stroke:#25405c;stroke-width:2}
.flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 12;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-44}}

.uart{animation:m1 8s step-end infinite}.updi{animation:m2 8s step-end infinite}
@keyframes m1{0%{opacity:1}50%{opacity:0}}
@keyframes m2{0%{opacity:0}50%{opacity:1}}
.knob{animation:knob 8s step-end infinite}
@keyframes knob{0%{transform:translateX(0)}50%{transform:translateX(34px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="960" height="340" rx="22" fill="#0b1622"/>
<text x="40" y="52" class="h">UART ⇄ UPDI mode (SW4)</text><text x="40" y="78" class="s">Slide SW4 to UPDI: TX is linked to RX through 4.7 kΩ, and RX/UPDI becomes a one-wire programmer for ATtiny 0/1/2-series and AVR-Dx.</text><rect x="60" y="130" width="80" height="34" rx="8" fill="#cbd5e1"/><g class="knob"><rect x="66" y="135" width="34" height="24" rx="5" fill="#111827"/></g><text x="100" y="188" text-anchor="middle" class="t">SW4</text><g class="uart"><text x="100" y="118" text-anchor="middle" style="fill:#fb923c;font-weight:800">UART</text></g><g class="updi"><text x="100" y="118" text-anchor="middle" style="fill:#4ade80;font-weight:800">UPDI</text></g><rect class="box" x="220" y="110" width="150" height="170" rx="16" style="stroke:#2dd4bf"/><text class="t" x="295" y="200" text-anchor="middle">CH343G</text><g class="uart"><path d="M370 160H760" stroke="#fb923c" stroke-width="4"/><path d="M370 230H760" stroke="#4ade80" stroke-width="4"/><text x="390" y="150" style="fill:#fb923c;font-weight:800">TX →</text><text x="390" y="252" style="fill:#4ade80;font-weight:800">← RX</text><circle r="6" fill="#fb923c"><animateMotion dur="1.6s" repeatCount="indefinite" path="M380 160H750"/></circle><circle r="6" fill="#4ade80"><animateMotion dur="1.6s" begin=".8s" repeatCount="indefinite" path="M750 230H380"/></circle><rect class="box" x="760" y="120" width="170" height="140" rx="16"/><text class="t" x="845" y="186" text-anchor="middle">ESP / Arduino</text><text class="s" x="845" y="208" text-anchor="middle">normal serial</text></g><g class="updi"><path d="M370 160H470V190" stroke="#fb923c" stroke-width="4"/><rect x="456" y="190" width="28" height="44" rx="4" fill="#122235" stroke="#e6eef8" stroke-width="2"/><text x="500" y="217" class="s">4.7 kΩ</text><path d="M470 234V250" stroke="#4ade80" stroke-width="4"/><path d="M370 250H760" stroke="#4ade80" stroke-width="4"/><circle cx="470" cy="250" r="6" fill="#4ade80"/><text x="600" y="240" text-anchor="middle" style="fill:#4ade80;font-weight:800">UPDI (one wire, both ways)</text><circle r="6" fill="#4ade80"><animateMotion dur="1.4s" repeatCount="indefinite" path="M480 250H750"/></circle><circle r="6" fill="#facc15"><animateMotion dur="1.4s" begin=".7s" repeatCount="indefinite" path="M750 250H480"/></circle><rect class="box" x="760" y="120" width="170" height="160" rx="16" style="stroke:#4ade80"/><text class="t" x="845" y="190" text-anchor="middle">ATtiny1614</text><text class="s" x="845" y="212" text-anchor="middle">AVR-DA / DB / DD</text><text class="s" x="845" y="234" text-anchor="middle">UPDI pin</text></g><text x="40" y="318" class="s">Arduino IDE: megaTinyCore / DxCore → Programmer "SerialUPDI - 230400 baud". Or: pymcuprog -t uart -u COMx -d attiny1614 write -f app.hex</text>
</svg>